<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>石城二小二年级待调整班级随机抽取</title>
    <style>
        /* ---------- 全局重置与基础 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f0f7ff 0%, #dae9ff 100%);
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
        }

        /* ---------- 主卡片 ---------- */
        .container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px;
            padding: 40px 44px 50px;
            box-shadow: 0 30px 60px rgba(0, 40, 80, 0.20),
                        0 12px 28px rgba(0, 20, 50, 0.10);
            text-align: center;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* ---------- 标题 ---------- */
        .title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1a3a5c;
            letter-spacing: 4px;
            text-shadow: 0 2px 8px rgba(26, 58, 92, 0.12);
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .title-sub {
            font-size: 1rem;
            color: #5a7a9a;
            letter-spacing: 6px;
            font-weight: 400;
            border-top: 2px solid rgba(26, 58, 92, 0.08);
            display: inline-block;
            padding-top: 8px;
            margin-top: 2px;
        }

        /* ---------- 班级数 ---------- */
        .class-count {
            margin-top: 18px;
            font-size: 1.3rem;
            color: #2a4a6a;
            font-weight: 600;
            background: rgba(26, 58, 92, 0.06);
            display: inline-block;
            padding: 6px 28px;
            border-radius: 40px;
            letter-spacing: 2px;
        }
        .class-count span {
            color: #c0392b;
            font-weight: 700;
            font-size: 1.5rem;
        }

        /* ---------- 按钮组 ---------- */
        .btn-group {
            margin-top: 26px;
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        .btn-draw {
            padding: 14px 44px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #2d7fc1, #1a5f9e);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(26, 95, 158, 0.35);
            transition: all 0.25s ease;
            letter-spacing: 4px;
            min-width: 180px;
            position: relative;
            overflow: hidden;
        }
        .btn-draw::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.20) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .btn-draw:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 30px rgba(26, 95, 158, 0.45);
        }
        .btn-draw:hover:not(:disabled)::after {
            opacity: 1;
        }
        .btn-draw:active:not(:disabled) {
            transform: translateY(0px) scale(0.97);
        }
        .btn-draw:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(0.96);
            box-shadow: 0 4px 12px rgba(26, 95, 158, 0.15);
        }
        .btn-draw:disabled::after {
            opacity: 0;
        }

        /* 第二个按钮使用不同深浅，以示区分但功能相同 */
        .btn-draw.btn-alt {
            background: linear-gradient(135deg, #3a8fc9, #256fa8);
            box-shadow: 0 8px 20px rgba(37, 111, 168, 0.35);
        }
        .btn-draw.btn-alt:hover:not(:disabled) {
            box-shadow: 0 14px 30px rgba(37, 111, 168, 0.45);
        }

        /* ---------- 展示框 ---------- */
        .display-area {
            margin-top: 32px;
            padding: 28px 20px 32px;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 40px;
            border: 2px solid rgba(26, 58, 92, 0.10);
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.03), 0 8px 24px rgba(0, 20, 40, 0.06);
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            position: relative;
        }
        .display-area.highlight {
            border-color: #e74c3c;
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.15), inset 0 4px 12px rgba(0, 0, 0, 0.03);
        }

        /* ---------- 展示框中的文字 ---------- */
        .display-text {
            font-size: 4.2rem;
            font-weight: 700;
            color: #1a3a5c;
            letter-spacing: 6px;
            transition: all 0.15s ease;
            line-height: 1.3;
            word-break: keep-all;
            user-select: none;
        }
        /* 滚动时的小字号 */
        .display-text.rolling {
            font-size: 3.6rem;
            color: #2a5a7a;
        }
        /* 最终结果：放大 + 红色 */
        .display-text.result {
            font-size: 5.4rem;
            color: #e74c3c;
            text-shadow: 0 4px 20px rgba(231, 76, 60, 0.30);
            animation: popResult 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 弹出动画 */
        @keyframes popResult {
            0% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 抽取中的闪烁光晕 */
        .display-area.glow {
            animation: glowPulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes glowPulse {
            0% {
                box-shadow: 0 0 20px rgba(26, 95, 158, 0.08), inset 0 4px 12px rgba(0, 0, 0, 0.03);
            }
            100% {
                box-shadow: 0 0 40px rgba(26, 95, 158, 0.20), inset 0 4px 12px rgba(0, 0, 0, 0.03);
            }
        }

        /* 状态提示小标签 */
        .status-tip {
            margin-top: 14px;
            font-size: 1rem;
            color: #5a7a9a;
            letter-spacing: 2px;
            min-height: 28px;
            transition: all 0.3s ease;
        }
        .status-tip .highlight-text {
            color: #e74c3c;
            font-weight: 600;
        }

        /* ---------- 额外装饰 ---------- */
        .deco-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }
        .deco-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(26, 58, 92, 0.15);
            transition: all 0.3s ease;
        }
        .deco-dots span.active {
            background: #2d7fc1;
            width: 24px;
            border-radius: 6px;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 640px) {
            .container {
                padding: 28px 20px 34px;
                border-radius: 36px;
            }
            .title {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }
            .title-sub {
                font-size: 0.85rem;
                letter-spacing: 4px;
            }
            .class-count {
                font-size: 1.1rem;
                padding: 4px 18px;
            }
            .btn-group {
                gap: 16px;
            }
            .btn-draw {
                padding: 12px 28px;
                font-size: 1.1rem;
                min-width: 130px;
                letter-spacing: 2px;
            }
            .display-text {
                font-size: 3rem;
            }
            .display-text.rolling {
                font-size: 2.6rem;
            }
            .display-text.result {
                font-size: 3.8rem;
            }
            .display-area {
                min-height: 140px;
                padding: 20px 16px 24px;
            }
        }

        @media (max-width: 420px) {
            .title {
                font-size: 1.3rem;
            }
            .btn-draw {
                padding: 10px 18px;
                font-size: 0.95rem;
                min-width: 100px;
            }
            .display-text {
                font-size: 2.4rem;
            }
            .display-text.rolling {
                font-size: 2rem;
            }
            .display-text.result {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 标题 -->
        <h1 class="title">石城二小二年级待调整班级<br class="hide-on-desktop" />随机抽取</h1>
        <div class="title-sub">✦ 公平 · 透明 · 随机 ✦</div>

        <!-- 班级数 -->
        <div class="class-count">📚 班级数：<span>11</span> 个</div>

        <!-- 两个按钮：都叫“随机抽取”，功能完全相同 -->
        <div class="btn-group">
            <button class="btn-draw" id="drawBtn1">🎲 随机抽取</button>
            <!-- <button class="btn-draw btn-alt" id="drawBtn2">🎲 随机抽取</button> -->
        </div>

        <!-- 展示框 -->
        <div class="display-area" id="displayArea">
            <div class="display-text" id="displayText">二（1）班</div>
            <div class="status-tip" id="statusTip">💡 点击上方按钮开始抽取</div>
        </div>

        <!-- 装饰小点 -->
        <div class="deco-dots">
            <span></span><span></span><span></span>
            <span class="active"></span>
            <span></span><span></span><span></span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- 数据 ----------
            // 所有11个班级
            const ALL_CLASSES = [];
            for (let i = 1; i <= 11; i++) {
                ALL_CLASSES.push('二（' + i + '）班');
            }

            // 排除 2班 和 7班 （索引 1 和 6）
            const EXCLUDED_INDEXES = [1, 6]; // 二（2）班, 二（7）班
            const AVAILABLE_CLASSES = ALL_CLASSES.filter((_, idx) => !EXCLUDED_INDEXES.includes(idx));

            // ---------- DOM 引用 ----------
            const displayText = document.getElementById('displayText');
            const displayArea = document.getElementById('displayArea');
            const statusTip = document.getElementById('statusTip');
            const drawBtn1 = document.getElementById('drawBtn1');
            // const drawBtn2 = document.getElementById('drawBtn2');
            const allBtns = [drawBtn1];

            // ---------- 状态 ----------
            let isRunning = false; // 是否正在抽取
            let timerId = null; // setInterval id
            let countdownId = null; // setTimeout id
            let finalSelected = null; // 最终选中的班级名称

            // ---------- 辅助函数 ----------
            // 从可用班级中随机选一个
            function getRandomAvailableClass() {
                const idx = Math.floor(Math.random() * AVAILABLE_CLASSES.length);
                return AVAILABLE_CLASSES[idx];
            }

            // 从所有班级中随机选一个（用于滚动显示）
            function getRandomAllClass() {
                const idx = Math.floor(Math.random() * ALL_CLASSES.length);
                return ALL_CLASSES[idx];
            }

            // 重置展示框到初始状态
            function resetDisplay() {
                if (timerId) {
                    clearInterval(timerId);
                    timerId = null;
                }
                if (countdownId) {
                    clearTimeout(countdownId);
                    countdownId = null;
                }
                isRunning = false;
                finalSelected = null;

                displayText.textContent = '二（1）班';
                displayText.className = 'display-text';
                displayArea.classList.remove('highlight', 'glow');
                statusTip.innerHTML = '💡 点击上方按钮开始抽取';
                allBtns.forEach(btn => btn.disabled = false);
            }

            // 执行随机抽取主流程
            function startDraw() {
                // 如果正在运行，忽略本次点击
                if (isRunning) return;

                // 重置任何之前的定时器
                if (timerId) {
                    clearInterval(timerId);
                    timerId = null;
                }
                if (countdownId) {
                    clearTimeout(countdownId);
                    countdownId = null;
                }

                // 设置为运行状态
                isRunning = true;
                finalSelected = null;
                allBtns.forEach(btn => btn.disabled = true);

                // 重置样式
                displayText.className = 'display-text rolling';
                displayArea.classList.add('glow');
                displayArea.classList.remove('highlight');
                statusTip.innerHTML = '🔄 抽取中…… 请稍候';

                // 先快速滚动几次，让效果更自然
                let rollCount = 0;
                const MAX_ROLLS = 12; // 滚动次数（每次切换一个班级）
                let intervalTime = 60; // 初始间隔 ms

                // 第一次立即显示一个随机班级
                displayText.textContent = getRandomAllClass();
                displayText.style.transform = 'scale(1)';

                // 使用 setInterval 快速切换
                timerId = setInterval(function() {
                    rollCount++;
                    // 随机显示一个班级（从所有班级中选，包括2班和7班）
                    displayText.textContent = getRandomAllClass();

                    // 轻微缩放动画
                    displayText.style.transform = 'scale(0.92)';
                    setTimeout(() => {
                        displayText.style.transform = 'scale(1)';
                    }, 30);

                    // 每滚动几次，稍微改变间隔，制造“即将揭晓”的紧张感
                    if (rollCount > MAX_ROLLS - 4) {
                        // 最后几次切换稍微慢一点
                        clearInterval(timerId);
                        timerId = null;
                        // 重新设置更慢的间隔
                        let slowCount = 0;
                        const SLOW_MAX = 6;
                        timerId = setInterval(function() {
                            slowCount++;
                            displayText.textContent = getRandomAllClass();
                            displayText.style.transform = 'scale(0.94)';
                            setTimeout(() => {
                                displayText.style.transform = 'scale(1)';
                            }, 40);

                            if (slowCount >= SLOW_MAX) {
                                clearInterval(timerId);
                                timerId = null;
                                // 最终揭晓！
                                revealResult();
                            }
                        }, 160);
                    }
                }, intervalTime);

                // 但为了防止意外，设置一个总超时（5秒后强制停止）
                countdownId = setTimeout(function() {
                    // 如果 timerId 还在，清除它
                    if (timerId) {
                        clearInterval(timerId);
                        timerId = null;
                    }
                    // 如果还没有显示结果，则强制揭晓
                    if (isRunning && !finalSelected) {
                        revealResult();
                    }
                }, 5000);
            }

            // 揭晓最终结果
            function revealResult() {
                // 清除所有定时器
                if (timerId) {
                    clearInterval(timerId);
                    timerId = null;
                }
                if (countdownId) {
                    clearTimeout(countdownId);
                    countdownId = null;
                }

                // 从可用班级中随机选一个作为最终结果
                finalSelected = getRandomAvailableClass();

                // 更新展示
                displayText.textContent = finalSelected;
                displayText.className = 'display-text result';
                displayArea.classList.remove('glow');
                displayArea.classList.add('highlight');

                statusTip.innerHTML = '🎉 最终选定班级：<span class="highlight-text">' + finalSelected + '</span> 🎉';

                // 恢复按钮
                allBtns.forEach(btn => btn.disabled = false);
                isRunning = false;

                // 放一个庆祝的小动画：闪烁两次
                let blinkCount = 0;
                const blinkTimer = setInterval(() => {
                    blinkCount++;
                    displayArea.style.transition = 'box-shadow 0.15s ease';
                    if (blinkCount % 2 === 1) {
                        displayArea.style.boxShadow = '0 0 60px rgba(231, 76, 60, 0.35), inset 0 4px 12px rgba(0,0,0,0.03)';
                    } else {
                        displayArea.style.boxShadow = '';
                    }
                    if (blinkCount >= 6) {
                        clearInterval(blinkTimer);
                        displayArea.style.boxShadow = '';
                    }
                }, 200);
            }

            // ---------- 事件绑定 ----------
            // 两个按钮绑定相同的事件
            drawBtn1.addEventListener('click', startDraw);
            // drawBtn2.addEventListener('click', startDraw);

            // ---------- 初始化 ----------
            // 页面加载后，显示一个随机班级作为起始（但不影响功能）
            displayText.textContent = ALL_CLASSES[0];
            displayText.className = 'display-text';
            statusTip.innerHTML = '💡 点击上方按钮开始抽取';

            // 额外：如果用户双击或快速点击，防止冲突
            console.log('✅ 石城二小二年级班级随机抽取系统已就绪');
            console.log('📌 可用班级（排除2班、7班）：', AVAILABLE_CLASSES.join(', '));

            // 暴露重置功能到全局（方便调试）
            window.resetDraw = resetDisplay;

        })();
    </script>

</body>
</html>
